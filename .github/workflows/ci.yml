name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        pg:
          - version: "9.4"
          - version: "9.5"
          - version: "9.6"
          - version: "10"
          - version: "11"
          - version: "12"
          - version: "13"
          - version: "14"
          - version: "15"
          - version: "16"
          - version: "17"
          - version: "18"

        pair:
          - elixir: "1.15"
            otp: "25"
        include:
          - pg:
              version: "18"
            pair:
              elixir: "1.19"
              otp: "28"
            lint: lint
    env:
      MIX_ENV: test
    steps:
      - name: Start PostgreSQL
        run: |
          # Server certificate for localhost signed by a throwaway CA. The CA
          # is trusted on the runner so `ssl: true` (verify_peer) works.
          CERTS=$RUNNER_TEMP/certs
          mkdir -p $CERTS && cd $CERTS
          openssl req -new -x509 -days 1 -nodes -newkey rsa:2048 \
            -subj "/CN=Postgrex Test CA" -keyout ca.key -out ca.crt
          openssl req -new -nodes -newkey rsa:2048 \
            -subj "/CN=localhost" -keyout server.key -out server.csr
          openssl x509 -req -days 1 -in server.csr -CA ca.crt -CAkey ca.key -set_serial 1 \
            -extfile <(echo "subjectAltName=DNS:localhost,IP:127.0.0.1") -out server.crt
          sudo cp ca.crt /usr/local/share/ca-certificates/postgrex-test-ca.crt
          sudo update-ca-certificates

          # Postgres requires the key to be owned by its user with mode 0600,
          # so copy it into place before handing over to the image entrypoint.
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -v $CERTS:/certs:ro \
            -v /var/run/postgresql:/var/run/postgresql \
            --entrypoint bash postgres:${{ matrix.pg.version }} \
            -c 'install -o postgres -g postgres -m 600 /certs/server.key /tmp/server.key && exec docker-entrypoint.sh "$@"' -- \
            postgres -c ssl=on -c ssl_cert_file=/certs/server.crt \
              -c ssl_key_file=/tmp/server.key -c wal_level=logical

          # Check over TCP: during initialization the image runs a temporary
          # server that only listens on the unix socket.
          for i in $(seq 1 60); do
            docker exec pg pg_isready -h localhost -U postgres && exit 0
            sleep 1
          done
          docker logs pg
          exit 1

      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.pair.otp}}
          elixir-version: ${{matrix.pair.elixir}}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{matrix.pair.elixir}}-${{matrix.pair.otp}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix deps.get

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - run: mix test
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PG_SOCKET_DIR: /var/run/postgresql
